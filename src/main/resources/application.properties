spring.application.name=reservation_movie

# Configurações de conexão com o PostgreSQL (Porta alterada para 5434)
spring.datasource.url=jdbc:postgresql://localhost:5434/movie_reservation_db
spring.datasource.username=admin
spring.datasource.password=adminpassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true